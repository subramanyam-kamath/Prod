run-name: ${{ github.actor }} is testing out GitHub Action🚀
on: 
  push:
   branches:
      - "destructive/**"
   


jobs:
    Getting-the-export-files:
     runs-on: ubuntu-latest
     environment: QA-Branch       
     
     steps:            
      - uses: actions/setup-node@v3
        with:
         node-version: '14'

      - name: "Checkout source code"
        uses: actions/checkout@v3
        with:
          fetch-depth: 0              
      

      - name: Get diff file names
        id: vars
        run: echo ::set-output name=version::$( git diff --name-only --diff-filter=A  origin/main..${{github.ref_name}} force-app/) 

      - name: print the classes
        run: cat ${{steps.vars.outputs.version}}

      - name: create new directory
        run: mkdir -p  destructive

      - name: copy the files to directory
        run: cp --parents ${{steps.vars.outputs.version}} destructive

      #- name: git config set
        #if: ${{always()}}
        #run: |
                #git config --global user.email "subramanyam.kamath@gmail.com"
                #git config --global user.name "subramanyam-kamath" 
              

      #- name: Push & Commit file    
        #if: ${{always()}}
        #run: | 
                   #git pull origin ${{github.ref_name}}
                   #git  add destructive                
                   #git commit -m "added destructive file"


      #- name: Push file to remote repository. 
        #if: ${{always()}}
        #run: |
              
               #git push origin ${{github.ref_name}}

      - name: "Install Salesforce CLI"
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          ~/sfdx/bin/sfdx version
          
      - name: "Installing sfdx git delta"
        run: |
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      - name: Generate the package.xml for delta files for QA deployment        
        run: |
          mkdir delta
          sfdx sgd:source:delta --from origin/main --source destructive --output "./delta" --ignore-whitespace -d -i .sgdignore
          echo "--- package.xml generated with added and modified metadata ---"
          cat delta/package/package.xml
            

